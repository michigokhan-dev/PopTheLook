<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | POP THE LOOK</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f0e7;
      color: #211e19;
    }
    header {
      padding: 22px 5%;
      background: #211e19;
      color: #f5f0e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 25px;
      letter-spacing: 2px;
    }
    header span {
      font-size: 13px;
    }
    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 30px;
    }
    .notice {
      padding: 20px;
      background: #fffdf9;
      border: 1px solid #ded5c7;
      margin-top: 25px;
    }
    .status {
      color: #796b58;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 19px;
      }
      main {
        margin-top: 25px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>POP THE LOOK</h1>
    <span>ADMIN PANEL</span>
  </header>
  <main>
    <h2>Dashboard</h2>
    <p>Welcome to your store management panel.</p>
    <section class="notice">
      <h3>Product Management</h3>
     <p class="status" id="connection-status">Supabase bağlantısı kontrol ediliyor...</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../frontend/scripts/supabase.js"></script>
<script>
  async function testSupabaseConnection() {
    const status = document.getElementById("connection-status");
    status.textContent = "Checking Supabase connection...";
    try {
      const { error } = await supabaseClient
        .from("products")
        .select("id")
        .limit(1);
      if (error) throw error;
      status.textContent = "Supabase connection successful.";
    } catch (error) {
      status.textContent = "Connection error: " + error.message;
    }
  }
  testSupabaseConnection();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Your Cart | POP THE LOOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#211e19;--muted:#796b58;--line:#ded5c7}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--ink);font-family:"DM Sans",sans-serif}
    header{min-height:76px;padding:18px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
    .logo{font-family:"Playfair Display",serif;font-size:clamp(21px,3vw,30px);font-weight:600;letter-spacing:1px;color:var(--ink);text-decoration:none}
    header nav{display:flex;gap:18px;align-items:center}
    a{color:var(--ink)}
    main{width:min(1000px,92%);margin:42px auto 70px}
    h1{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(30px,4vw,42px);margin:0 0 28px}
    .cart-item{display:grid;grid-template-columns:100px 1fr auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
    .cart-item img{width:100px;height:125px;object-fit:contain;background:#fff}
    .item-name{font-weight:600;margin:0 0 8px}
    .meta{font-size:13px;color:var(--muted);margin:5px 0}
    .quantity{display:flex;align-items:center;gap:10px;margin-top:12px}
    .quantity button,.remove{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 11px;cursor:pointer}
    .remove{border:0;text-decoration:underline;padding:6px 0;margin-top:8px}
    .item-total{font-weight:600;white-space:nowrap}
    .summary{margin:28px 0 0 auto;width:min(360px,100%)}
    .summary-row{display:flex;justify-content:space-between;gap:20px;margin:12px 0}
    .checkout{display:block;width:100%;margin-top:22px;min-height:52px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;letter-spacing:1px;text-align:center;text-decoration:none;padding:16px}
    .continue{display:inline-block;margin-top:18px;text-decoration:none}
    .empty{padding:28px 0;color:var(--muted)}
    .notice{font-size:13px;color:var(--muted);line-height:1.6}
    @media(max-width:600px){header{padding:16px 4%}header nav{gap:12px;font-size:13px}main{margin-top:30px}.cart-item{grid-template-columns:76px 1fr;gap:12px}.cart-item img{width:76px;height:100px}.item-total{grid-column:2}.summary{width:100%}}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="../../index.html">POP THE LOOK</a>
    <nav aria-label="Cart navigation">
      <a href="../../index.html#shop">Continue shopping</a>
      <a href="cart.html" aria-current="page">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>
  <main>
    <h1>Your shopping bag</h1>
    <div id="cart-items"></div>
    <section id="summary" class="summary" hidden>
      <div class="summary-row"><span>Subtotal</span><strong id="subtotal">£0.00</strong></div>
      <p class="notice">Shipping and any applicable taxes are calculated at checkout.</p>
      <a class="checkout" href="#" id="checkout-button">PROCEED TO CHECKOUT</a>
    </section>
    <a class="continue" href="../../index.html#shop">← Continue shopping</a>
  </main>
  <script>
    const CART_KEY = "popTheLookCart";
    const money = value => new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP"}).format(Number(value)||0);
    const readCart = () => {
      try {
        const cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(cart) ? cart : [];
      } catch { return []; }
    };
    const saveCart = cart => {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      renderCart();
    };
    function renderCart(){
      const cart = readCart();
      const root = document.getElementById("cart-items");
      const count = cart.reduce((sum,item)=>sum+Math.max(0,Number(item.quantity)||0),0);
      document.getElementById("cart-count").textContent = count;
      root.replaceChildren();
      if(!cart.length){
        root.innerHTML = '<p class="empty">Your cart is empty.</p>';
        document.getElementById("summary").hidden = true;
        return;
      }
      let subtotal = 0;
      cart.forEach((item,index)=>{
        const price = Number(item.price)||0;
        const quantity = Math.max(1,Number(item.quantity)||1);
        subtotal += price*quantity;
        const article = document.createElement("article");
        article.className = "cart-item";
        const img = document.createElement("img");
        img.src = item.image || "";
        img.style.cursor = "pointer";
img.addEventListener("click", () => {
  if (item.productId) {
    window.location.href =
      `product.html?id=${encodeURIComponent(item.productId)}`;
  }
});
        img.alt = item.name || "Product";
        img.loading = "lazy";
        img.onerror = ()=>{img.style.visibility="hidden";};
        const info = document.createElement("div");
        const name = document.createElement("p"); name.className="item-name"; name.textContent=item.name||"Product";
        const priceLine = document.createElement("p"); priceLine.className="meta"; priceLine.textContent=money(price);
        const color = document.createElement("p"); color.className="meta"; color.textContent="Colour: "+(item.color||"Default");
        const size = document.createElement("p"); size.className="meta"; size.textContent="Size: "+(item.size||"One size");
        const controls = document.createElement("div"); controls.className="quantity";
        const minus = document.createElement("button"); minus.type="button"; minus.textContent="−"; minus.setAttribute("aria-label","Decrease quantity");
        const qty = document.createElement("span"); qty.textContent=quantity;
        const plus = document.createElement("button"); plus.type="button"; plus.textContent="+"; plus.setAttribute("aria-label","Increase quantity");
        minus.disabled = quantity<=1;
        minus.addEventListener("click",()=>{const latest=readCart();if(latest[index]){latest[index].quantity=Math.max(1,(Number(latest[index].quantity)||1)-1);saveCart(latest);}});
        plus.addEventListener("click",()=>{const latest=readCart();if(latest[index]){latest[index].quantity=(Number(latest[index].quantity)||1)+1;saveCart(latest);}});
        controls.append(minus,qty,plus);
        const remove = document.createElement("button"); remove.type="button"; remove.className="remove"; remove.textContent="Remove";
        remove.addEventListener("click",()=>{const latest=readCart();latest.splice(index,1);saveCart(latest);});
        info.append(name,priceLine,color,size,controls,remove);
        const total = document.createElement("div"); total.className="item-total"; total.textContent=money(price*quantity);
        article.append(img,info,total); root.appendChild(article);
      });
      document.getElementById("subtotal").textContent=money(subtotal);
      document.getElementById("summary").hidden=false;
    }
    document.getElementById("checkout-button").addEventListener("click", event => {
  event.preventDefault();
  window.location.href = "checkout.html";
});
    window.addEventListener("storage",event=>{if(event.key===CART_KEY)renderCart();});
    renderCart();
  </script>
</body>
</html>

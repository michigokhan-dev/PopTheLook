
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | POP THE LOOK</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f3ed;
      color: #29251f;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 430px;
      padding: 42px;
      background: #fffdf9;
      border: 1px solid #e8dfd2;
    }
    h1 { font-family: Georgia, serif; font-weight: 500; }
    p { color: #777067; line-height: 1.6; }
    label { display: block; margin: 20px 0 8px; font-size: 13px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9d0c4;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: 0;
      background: #29251f;
      color: white;
      letter-spacing: 2px;
      cursor: pointer;
    }
    a { color: inherit; }

    .password-wrapper {
  position: relative;
}

.password-wrapper .toggle-password {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  margin: 0;
  padding: 6px;
  background: transparent;
  color: #29251f;
  letter-spacing: 0;
}
  </style>
</head>
<body>
  <main>
    <h1>Set a new password</h1>
    <p>Choose a new password for your account.</p>

  
<form id="reset-form">
  <label for="password">New password</label>
  <div class="password-wrapper">
    <input id="password" type="password" minlength="6"
      autocomplete="new-password" required>
    <button type="button" class="toggle-password"
      onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password'; this.textContent=p.type==='password'?'Show':'Hide';">Show</button>
  </div>



      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" minlength="6"
        autocomplete="new-password" required>

      
<button type="button" onclick="const p=document.getElementById('confirm-password'); p.type=p.type==='password'?'text':'password'; this.textContent=p.type==='password'?'Show':'Hide';">Show</button>


      <button type="submit">UPDATE PASSWORD</button>
    </form>

    <p><a href="signin.html">Back to sign in</a></p>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://imkkafqtlvuzloalcfvk.supabase.co",
      "sb_publishable_aetzVolyZMx-vTdoaZ9zXw_OtEefK-N"
    );

    document.getElementById("reset-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const button = event.currentTarget.querySelector("button");

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      button.disabled = true;

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        alert(error.message);
        button.disabled = false;
        return;
      }

      alert("Password updated successfully. Please sign in.");
      window.location.href = "signin.html";
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | POP THE LOOK</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f3ed;
      color: #29251f;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 430px;
      padding: 42px;
      background: #fffdf9;
      border: 1px solid #e8dfd2;
    }
    h1 { font-family: Georgia, serif; font-weight: 500; }
    p { color: #777067; line-height: 1.6; }
    label { display: block; margin: 22px 0 8px; font-size: 13px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9d0c4;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: 0;
      background: #29251f;
      color: white;
      letter-spacing: 2px;
      cursor: pointer;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Forgot password?</h1>
    <p>Enter your email address and we’ll send you a password reset link.</p>

    <form id="reset-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="you@example.com" required>
      <button type="submit">SEND RESET LINK</button>
    </form>

    <p><a href="signin.html">Back to sign in</a></p>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://imkkafqtlvuzloalcfvk.supabase.co",
      "sb_publishable_aetzVolyZMx-vTdoaZ9zXw_OtEefK-N"
    );

    document.getElementById("reset-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const button = event.currentTarget.querySelector("button");
      button.disabled = true;

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: "https://michigokhan-dev.github.io/PopTheLook/frontend/pages/reset-password.html"
      });

      if (error) {
        alert(error.message);
        button.disabled = false;
        return;
      }

      alert("If an account exists for this email, a password reset link will be sent.");
      button.disabled = false;
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Products | POP THE LOOK</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    .search-results-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 5%;
    }

    .search-results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .search-results-actions {
      display: flex;
      gap: 12px;
    }

    .search-results-actions a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #ded5c7;
      border-radius: 24px;
      color: #211e19;
      text-decoration: none;
    }

    #search-results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }
  </style>
</head>
<body>
  <main class="search-results-page">
    <header class="search-results-header">
      <div>
        <h1 id="search-results-title">Search results</h1>
        <p id="search-results-count">Loading products...</p>
      </div>

      <nav class="search-results-actions">
        <a href="../../index.html">Home</a>
        <a href="javascript:history.back()">Back</a>
      </nav>
    </header>

    <section id="search-results-grid" aria-live="polite"></section>
  </main>

  <script type="module" src="../scripts/search.js"></script>
</body>
</html>

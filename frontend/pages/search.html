<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Products | POP THE LOOK</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    .search-results-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 5%;
    }

    .search-results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .search-results-actions {
      display: flex;
      gap: 12px;
    }

    .search-results-actions a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #ded5c7;
      border-radius: 24px;
      color: #211e19;
      text-decoration: none;
    }

    #search-results-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 36px 24px;
  width: 100%;
}

#search-results-grid .product-card {
  min-width: 0;
  width: 100%;
}

#search-results-grid .product-card img {
  display: block;
  width: 100%;
  height: 400px;
  aspect-ratio: auto;
  object-fit: contain;
  object-position: center;
  background-color: #ffffff;
}

@media (max-width: 899px) {
  #search-results-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px 12px;
  }
}

@media (max-width: 480px) {
  #search-results-grid .product-card img {
    height: 220px;
  }
}
  </style>
</head>
<body>
  <main class="search-results-page">
    <header class="search-results-header">
      <div>
        <h1 id="search-results-title">Search results</h1>
        <p id="search-results-count">Loading products...</p>
      </div>

      <nav class="search-results-actions">
        <a href="../../index.html">Home</a>
      </nav>
    </header>

    <section id="search-results-grid" aria-live="polite"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../scripts/supabase.js"></script>
  <script type="module" src="../scripts/search.js"></script>
</body>
</html>

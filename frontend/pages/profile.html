<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | POP THE LOOK</title>
  <meta name="description" content="Manage your POP THE LOOK profile and delivery details.">
  <style>
    :root {
      --white: #ffffff;
      --ink: #211e19;
      --muted: #706b64;
      --line: #dedede;
      --success: #246b3b;
      --error: #a32626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, sans-serif;
    }

    a { color: inherit; }

    .site-header {
      min-height: 78px;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: clamp(22px, 3vw, 31px);
      font-weight: 600;
      letter-spacing: .02em;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    main {
      width: min(760px, 90%);
      margin: 46px auto 80px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font: 500 clamp(34px, 5vw, 46px) Georgia, serif;
    }

    .intro {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .profile-card {
      padding: 28px;
      border: 1px solid var(--line);
      background: #ffffff;
    }

    h2 {
      margin: 0 0 22px;
      font: 500 25px Georgia, serif;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      background: #ffffff;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      color: var(--ink);
    }

    input, select {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: 1px solid var(--ink);
      outline-offset: 1px;
    }

    input[readonly] {
      background: #ffffff;
      color: #555555;
    }

    .button {
      width: 100%;
      min-height: 52px;
      margin-top: 26px;
      padding: 14px 18px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #ffffff;
      font: inherit;
      font-size: 12px;
      letter-spacing: .12em;
      cursor: pointer;
    }

    .button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin: 16px 0 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .message.success { color: var(--success); }
    .message.error { color: var(--error); }

    .signout {
      display: block;
      margin: 24px auto 0;
      padding: 8px;
      border: 0;
      background: #ffffff;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    @media (max-width: 560px) {
      main { margin-top: 32px; }
      .profile-card { padding: 20px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .site-header { padding-left: 5%; padding-right: 5%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../../index.html">POP THE LOOK</a>
    <a class="back-link" href="../../index.html">← Back to home</a>
  </header>

  <main>
    <p class="eyebrow">My account / Profile</p>
    <h1>My profile</h1>
    <p class="intro">Manage your personal information and delivery address.</p>

    <section class="profile-card">
      <form id="profile-form">
        <h2>Personal information</h2>
        <div class="form-grid">
          <div class="field">
            <label for="first-name">First name *</label>
            <input id="first-name" name="firstName" autocomplete="given-name" required>
          </div>

          <div class="field">
            <label for="last-name">Last name *</label>
            <input id="last-name" name="lastName" autocomplete="family-name" required>
          </div>

          <div class="field full">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" readonly>
          </div>

          <div class="field full">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">
          </div>
        </div>

        <h2 style="margin-top: 34px;">Delivery address</h2>
        <div class="form-grid">
          <div class="field full">
            <label for="address-line1">Address line 1</label>
            <input id="address-line1" name="address_line1" autocomplete="address-line1">
          </div>

          <div class="field full">
            <label for="address-line2">Address line 2</label>
            <input id="address-line2" name="address_line2" autocomplete="address-line2">
          </div>

          <div class="field">
            <label for="city">Town / City</label>
            <input id="city" name="city" autocomplete="address-level2">
          </div>

          <div class="field">
            <label for="postcode">Postcode</label>
            <input id="postcode" name="postcode" autocomplete="postal-code">
          </div>

          <div class="field full">
            <label for="country">Country</label>
            <select id="country" name="country" autocomplete="country-name">
              <option value="United Kingdom">United Kingdom</option>
              <option value="Ireland">Ireland</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <button class="button" id="save-button" type="submit">SAVE CHANGES</button>
        <p id="form-message" class="message" role="status" hidden></p>
      </form>
    </section>

    <button class="signout" id="sign-out-button" type="button">Sign out</button>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://imkkafqtlvuzloalcfvk.supabase.co",
      "sb_publishable_aetzVolyZMx-vTdoaZ9zXw_OtEefK-N"
    );

    const form = document.getElementById("profile-form");
    const saveButton = document.getElementById("save-button");
    const message = document.getElementById("form-message");
    let currentUser = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
      message.hidden = false;
    }

    function splitFullName(fullName) {
      const parts = (fullName || "").trim().split(/\s+/).filter(Boolean);
      return {
        firstName: parts.shift() || "",
        lastName: parts.join(" ")
      };
    }

    async function loadProfile() {
      saveButton.disabled = true;

      const { data: userData, error: userError } = await supabase.auth.getUser();
      if (userError || !userData.user) {
        window.location.replace("signin.html");
        return;
      }

      currentUser = userData.user;
      document.getElementById("email").value = currentUser.email || "";

      const { data: profile, error } = await supabase
        .from("profiles")
        .select("id, full_name, phone, address_line1, address_line2, city, postcode, country")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (error) {
        showMessage("Could not load your profile. Please check the profiles table permissions.", "error");
        saveButton.disabled = false;
        return;
      }

      const fullName = profile?.full_name || currentUser.user_metadata?.full_name || "";
      const names = splitFullName(fullName);

      document.getElementById("first-name").value = names.firstName;
      document.getElementById("last-name").value = names.lastName;
      document.getElementById("phone").value = profile?.phone || "";
      document.getElementById("address-line1").value = profile?.address_line1 || "";
      document.getElementById("address-line2").value = profile?.address_line2 || "";
      document.getElementById("city").value = profile?.city || "";
      document.getElementById("postcode").value = profile?.postcode || "";
      document.getElementById("country").value = profile?.country || "United Kingdom";

      saveButton.disabled = false;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!currentUser) return;

      saveButton.disabled = true;
      saveButton.textContent = "SAVING...";
      message.hidden = true;

      const firstName = document.getElementById("first-name").value.trim();
      const lastName = document.getElementById("last-name").value.trim();
      const fullName = [firstName, lastName].filter(Boolean).join(" ");

      const profileData = {
        id: currentUser.id,
        full_name: fullName,
        phone: document.getElementById("phone").value.trim() || null,
        address_line1: document.getElementById("address-line1").value.trim() || null,
        address_line2: document.getElementById("address-line2").value.trim() || null,
        city: document.getElementById("city").value.trim() || null,
        postcode: document.getElementById("postcode").value.trim() || null,
        country: document.getElementById("country").value || "United Kingdom"
      };

      const { error } = await supabase
        .from("profiles")
        .upsert(profileData, { onConflict: "id" });

      if (error) {
        showMessage("Could not save your profile. Please check the profiles table permissions. Details: " + error.message, "error");
      } else {
        await supabase.auth.updateUser({
          data: { full_name: fullName }
        });
        showMessage("Your profile has been saved.", "success");
      }

      saveButton.disabled = false;
      saveButton.textContent = "SAVE CHANGES";
    });

    document.getElementById("sign-out-button").addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        showMessage("Could not sign out. Please try again.", "error");
        return;
      }
      window.location.replace("signin.html");
    });

    loadProfile();
  </script>
</body>
</html>

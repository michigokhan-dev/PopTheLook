<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | POP THE LOOK</title>
  <meta name="description" content="Create your POP THE LOOK customer account.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f7f3ed;
      color: #29251f;
      font-family: Arial, sans-serif;
    }
    .signup {
      width: 100%;
      max-width: 460px;
      padding: 42px;
      background: #fffdf9;
      border: 1px solid #e8dfd2;
    }
    .brand {
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }
    h1 {
      text-align: center;
      font: 500 34px Georgia, serif;
      margin-bottom: 10px;
    }
    .intro {
      text-align: center;
      color: #777067;
      font-size: 14px;
      margin-bottom: 28px;
    }
    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9d0c4;
      background: white;
      font-size: 15px;
    }
    input:focus {
      outline: 1px solid #665541;
      border-color: #665541;
    }
    
button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: 0;
  background: #29251f;
  color: white;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
}

.password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper input {
  padding-right: 70px;
}

.password-wrapper .toggle-password {
  position: absolute;
  top: 0;
  right: 0;
  width: auto;
  height: 100%;
  margin: 0;
  padding: 0 14px;
  background: transparent;
  color: #29251f;
  border: none;
  font-size: 13px;
  letter-spacing: 0;
}

    .signin, .home {
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }
    .signin { margin-top: 24px; }
    .home {
      display: block;
      margin-top: 20px;
      color: #777067;
    }
    a { color: inherit; }
    @media (max-width: 480px) {
      .signup { padding: 30px 22px; }
    }
  </style>
</head>
<body>
  <main class="signup">
    <div class="brand">POP THE LOOK</div>
    <h1>Create your account</h1>
    <p class="intro">Join us and discover your next look.</p>
    <form id="signup-form">
      <label for="name">Full name</label>
      <input
        id="name"
        name="name"
        type="text"
        autocomplete="name"
        placeholder="Your full name"
        required
      >
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >
      <label for="password">Create password</label>
<div class="password-wrapper">
  <input
    id="password"
    name="password"
    type="password"
    autocomplete="new-password"
    minlength="8"
    placeholder="At least 8 characters"
    required
  >
  <button
    type="button"
    class="toggle-password"
    onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password'; this.textContent=p.type==='password'?'Show':'Hide';"
  >Show</button>
</div>

<button type="submit">CREATE ACCOUNT</button>
    </form>
    <div class="signin">
      Already have an account?
      <a href="signin.html">Sign in</a>
    </div>
    <a class="home" href="../../index.html">← Back to homepage</a>
  </main>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const supabase = createClient(
    "https://imkkafqtlvuzloalcfvk.supabase.co",
    "sb_publishable_aetzVolyZMx-vTdoaZ9zXw_OtEefK-N"
  );

  document.getElementById("signup-form").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = this.querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = "CREATING ACCOUNT...";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: name },
        emailRedirectTo: "https://michigokhan-dev.github.io/PopTheLook/"
      }
    });

    if (error) {
      alert(error.message);
      button.disabled = false;
      button.textContent = "CREATE ACCOUNT";
      return;
    }

    alert("Please check your email for the confirmation link.");
    button.disabled = false;
    button.textContent = "CREATE ACCOUNT";
  });
</script>

</body>
</html>

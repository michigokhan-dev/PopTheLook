<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e7">
  <meta name="description" content="Discover timeless women's fashion at POP THE LOOK.">
  <title>POP THE LOOK | Women's Fashion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f5f0e7;
      --ink: #211e19;
      --muted: #796b58;
      --line: #ded5c7;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
    }

    a { color: inherit; }

    /* HEADER */
    .header {
      height: 92px;
      padding: 0 5%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 30px;
      background: var(--cream);
      border-bottom: 1px solid rgba(33,30,25,.08);
      position: relative;
      z-index: 2;
    }

    .logo {
      justify-self: start;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(25px, 3vw, 43px);
      font-weight: 800;
      letter-spacing: -1.7px;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
    }

    .navigation {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 66px);
    }

    .navigation a {
      height: 100%;
      display: inline-flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      text-decoration: none;
      font-size: 16px;
    }

    .navigation a.active,
    .navigation a:hover {
      border-bottom-color: var(--ink);
    }

    .header-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: clamp(16px, 2vw, 27px);
    }

    .icon-button {
      width: 25px;
      height: 35px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      position: relative;
    }

    .icon-button svg {
      display: block;
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .cart-count {
      position: absolute;
      top: -1px;
      right: -11px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font: 10px Arial, sans-serif;
    }

/* HERO */
.hero {
  min-height: min(720px, calc(100svh - 92px));
  display: flex;
  align-items: center;
  padding: 65px 7.2%;
  background-color: #e2d3be;
  background-image: none;
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0 0 0 43%;
  background-image: url("hero.jpg");
  background-position: center 35%;
  background-repeat: no-repeat;
  background-size: cover;
  z-index: -2;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    #e2d3be 0%,
    #e2d3be 37%,
    rgba(226, 211, 190, 0.85) 45%,
    rgba(226, 211, 190, 0) 65%
  );
  z-index: -1;
}

.hero-content {
  width: 100%;
  max-width: 570px;
}

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 17px;
      margin-bottom: 29px;
      color: #796b58;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 4px;
    }

    .eyebrow::after {
      content: "";
      display: block;
      width: 65px;
      height: 1px;
      background: #95836c;
    }

    .hero h1 {
      margin: 0 0 24px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(56px, 6.2vw, 82px);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -2.7px;
    }

    .hero-description {
      margin: 0 0 32px;
      font-size: clamp(16px, 1.5vw, 20px);
      line-height: 1.6;
    }

    .hero-cta {
      min-height: 51px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      padding: 0 28px;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.1px;
      text-decoration: none;
      transition: background .2s;
    }

    .hero-cta:hover { background: #514537; }

    .hero-cta svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    /* BELOW THE HERO */
    .intro {
      padding: 76px 20px;
      text-align: center;
    }

    .intro-label {
      margin: 0 0 13px;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .intro h2 {
      margin: 0;
      font: 600 clamp(28px, 4vw, 40px) "Playfair Display", Georgia, serif;
    }

    footer {
      padding: 25px 20px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 12px;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .header {
        height: auto;
        min-height: 91px;
        padding: 17px 5% 0;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 13px;
        row-gap: 12px;
      }

      .logo {
        font-size: clamp(23px, 6vw, 30px);
        letter-spacing: -1.2px;
      }

      .header-actions { gap: 17px; }

      .icon-button,
      .icon-button svg {
        width: 22px;
        height: 26px;
      }

      .navigation {
        grid-column: 1 / -1;
        grid-row: 2;
        height: 46px;
        gap: clamp(35px, 10vw, 55px);
      }

      .navigation a { font-size: 14px; }

      .hero {
        min-height: 690px;
        min-height: calc(100svh - 137px);
        padding: 45px 6% 48px;
        align-items: flex-end;
        background-image:
          linear-gradient(
            0deg,
            rgba(226, 211, 190, .97) 0%,
            rgba(226, 211, 190, .88) 36%,
            rgba(226, 211, 190, .12) 75%
          ),
          url("hero.jpg");
        background-position: center, 58% center;
      }

      .hero-content { max-width: 100%; }

      .eyebrow {
        margin-bottom: 20px;
        font-size: 10px;
        letter-spacing: 3px;
        gap: 12px;
      }

      .eyebrow::after { width: 46px; }

      .hero h1 {
        font-size: clamp(47px, 11vw, 66px);
        letter-spacing: -1.8px;
        margin-bottom: 20px;
      }

      .hero-description {
        font-size: 15px;
        margin-bottom: 27px;
      }

      .hero-cta {
        min-height: 49px;
        padding: 0 17px;
        gap: 12px;
        font-size: 10px;
      }

      .intro { padding: 55px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="logo" href="#home">POP THE LOOK</a>

    <nav class="navigation" aria-label="Main navigation">
      <a class="active" href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
    </nav>

    <div class="header-actions">
      <a class="icon-button" href="#shop" aria-label="Search products">
        <svg viewBox="0 0 24 24">
          <circle cx="10.8" cy="10.8" r="7.2"/>
          <path d="m16 16 5 5"/>
        </svg>
      </a>

      <a class="icon-button" href="frontend/pages/signin.html" aria-label="Sign in or create an account">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="7.5" r="3.5"/>
          <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
        </svg>
      </a>

      <a class="icon-button" href="#cart" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24">
          <path d="M4 8h16l-1 13H5L4 8Z"/>
          <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
        </svg>
        <span class="cart-count">0</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-content">
        <div class="eyebrow">THE NEW COLLECTION</div>

        <h1>Style that<br>speaks softly.</h1>

        <p class="hero-description">
          Timeless pieces. Effortless elegance.<br>
          Discover your next favourite look.
        </p>

        <a class="hero-cta" href="#shop">
          EXPLORE THE COLLECTION
          <svg viewBox="0 0 24 24">
            <path d="M4 12h15M13 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </section>

    <section class="intro" id="shop">
      <p class="intro-label">POP THE LOOK</p>
      <h2>Your wardrobe, reimagined.</h2>
    </section>

    <footer id="about">
      © 2026 POP THE LOOK. All rights reserved.
    </footer>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | POP THE LOOK</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f0e7;
      color: #211e19;
    }
    header {
      padding: 22px 5%;
      background: #211e19;
      color: #f5f0e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 25px;
      letter-spacing: 2px;
    }
    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }
    h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 30px;
    }
    .panel {
      background: #fffdf9;
      border: 1px solid #ded5c7;
      padding: 22px;
      margin: 22px 0;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ded5c7;
      background: white;
      font: inherit;
      border-radius: 2px;
    }
    textarea {
      min-height: 85px;
      resize: vertical;
    }
    .full-width {
      grid-column: 1 / -1;
    }
    button {
      padding: 12px 18px;
      border: 1px solid #211e19;
      background: #211e19;
      color: white;
      cursor: pointer;
      font: inherit;
    }
    button:hover {
      opacity: 0.85;
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    .delete-button {
      padding: 8px 10px;
      background: #fffdf9;
      color: #8b2e2e;
      border-color: #8b2e2e;
    }
    #status {
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .product-list {
      display: grid;
      gap: 12px;
    }
    .product {
      border: 1px solid #ded5c7;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .product h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .product p {
      margin: 4px 0;
      font-size: 14px;
      color: #796b58;
      overflow-wrap: anywhere;
    }
    .product img {
      width: 65px;
      height: 80px;
      object-fit: cover;
      background: #f5f0e7;
      margin-bottom: 8px;
    }
    .product-info {
      min-width: 0;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 19px;
      }
      main {
        margin-top: 25px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .full-width {
        grid-column: auto;
      }
      .product {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>POP THE LOOK</h1>
    <span>ADMIN PANEL</span>
    <button id="sign-out-button" type="button">Sign Out</button>
  </header>
  <main id="admin-content" hidden>
    <h2>Dashboard</h2>
    <p>Manage your store products.</p>
    <section class="panel">
      <h2>Add Product</h2>
      <form id="product-form">
        <div class="form-grid">
          <div>
            <label for="name">Product Name *</label>
            <input id="name" name="name" required maxlength="150">
          </div>
          <div>
            <label for="price">Price (GBP) *</label>
            <input id="price" name="price" type="number"
              min="0" step="0.01" required>
          </div>
          <div>
            <label for="stock">Stock Quantity *</label>
            <input id="stock" name="stock" type="number"
              min="0" step="1" value="0" required>
          </div>
          <div>
            <label for="category">Category</label>
            <input id="category" name="category" maxlength="100">
          </div>
          <div class="full-width">
            <label for="image_url">Image URL</label>
            <input id="image_url" name="image_url" type="url"
              placeholder="https://example.com/image.jpg">
          </div>
          <div class="full-width">
            <label for="description">Description</label>
            <textarea id="description" name="description"
              maxlength="2000"></textarea>
          </div>
          <div class="full-width">
            <button id="add-button" type="submit">Add Product</button>
          </div>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">
        Connecting to Supabase...
      </p>
    </section>
    <section class="panel">
      <h2>Products</h2>
      <button id="refresh-button" type="button">Refresh Products</button>
      <div id="product-list" class="product-list">
        <p>Loading products...</p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../frontend/scripts/supabase.js"></script>
  <script>
    const form = document.getElementById("product-form");
    const statusMessage = document.getElementById("status");
    const productList = document.getElementById("product-list");
    const addButton = document.getElementById("add-button");
    let editingProductId = null;
    const refreshButton = document.getElementById("refresh-button");
    async function loadProducts() {
      productList.replaceChildren();
      const loading = document.createElement("p");
      loading.textContent = "Loading products...";
      productList.appendChild(loading);
      try {
        const { data, error } = await supabaseClient
          .from("products")
          .select("id, name, price, stock, category, image_url, description, is_active")
          .order("created_at", { ascending: false });
        if (error) throw error;
        productList.replaceChildren();
        if (!data || data.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "No products found.";
          productList.appendChild(empty);
          return;
        }
        data.forEach((product) => {
          const card = document.createElement("article");
          card.className = "product";
          const info = document.createElement("div");
          info.className = "product-info";
          if (product.image_url) {
            const image = document.createElement("img");
            image.src = product.image_url;
            image.alt = product.name || "Product image";
            image.loading = "lazy";
            image.onerror = () => image.remove();
            info.appendChild(image);
          }
          const name = document.createElement("h3");
          name.textContent = product.name;
          info.appendChild(name);
          const details = document.createElement("p");
          details.textContent =
            "£" + Number(product.price).toFixed(2) +
            " · Stock: " + product.stock +
            " · " + (product.category || "Uncategorised");
          info.appendChild(details);
          const active = document.createElement("p");
          active.textContent = product.is_active ? "Active" : "Inactive";
          info.appendChild(active);
          const editButton = document.createElement("button");
editButton.type = "button";
editButton.textContent = "Edit";
editButton.className = "edit-button";

editButton.addEventListener("click", () => {
  editingProductId = product.id;
  addButton.textContent = "Save Changes";

  form.elements.namedItem("name").value = product.name || "";
  form.elements.namedItem("price").value = product.price ?? "";
  form.elements.namedItem("stock").value = product.stock ?? 0;
  form.elements.namedItem("category").value = product.category || "";
  form.elements.namedItem("image_url").value = product.image_url || "";
  form.elements.namedItem("description").value = product.description || "";

  statusMessage.textContent =
    "Editing product: " + product.name +
    ". Update the fields above, then save your changes.";
  form.scrollIntoView({ behavior: "smooth", block: "start" });
});
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-button";
          deleteButton.textContent = "Delete";
          deleteButton.addEventListener("click", async () => {
            if (!confirm("Delete this product?")) return;
            deleteButton.disabled = true;
            try {
              const { error } = await supabaseClient
                .from("products")
                .delete()
                .eq("id", product.id);
              if (error) throw error;
              statusMessage.textContent = "Product deleted.";
              await loadProducts();
            } catch (error) {
              statusMessage.textContent = "Delete failed: " + error.message;
              deleteButton.disabled = false;
            }
          });
          card.append(info, editButton, deleteButton);
          productList.appendChild(card);
        });
      } catch (error) {
        productList.replaceChildren();
        const message = document.createElement("p");
        message.textContent = "Could not load products: " + error.message;
        productList.appendChild(message);
      }
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      addButton.disabled = true;
      statusMessage.textContent = "Saving product...";
      const formData = new FormData(form);
      const product = {
        name: String(formData.get("name")).trim(),
        price: Number(formData.get("price")),
        stock: Number(formData.get("stock")),
        category: String(formData.get("category") || "").trim() || null,
        image_url: String(formData.get("image_url") || "").trim() || null,
        description: String(formData.get("description") || "").trim() || null,
        is_active: true
      };
      try {
        if (editingProductId) {
  const { error } = await supabaseClient
    .from("products")
    .update(product)
    .eq("id", editingProductId);

  if (error) throw error;

  statusMessage.textContent = "Product updated successfully.";
  editingProductId = null;
  addButton.textContent = "Add Product";
} else {
  const { error } = await supabaseClient
    .from("products")
    .insert(product);

  if (error) throw error;

  statusMessage.textContent = "Product added successfully.";
}
        form.reset();
        document.getElementById("stock").value = "0";
        await loadProducts();
      } catch (error) {
        statusMessage.textContent = "Could not add product: " + error.message;
      } finally {
        addButton.disabled = false;
      }
    });
    refreshButton.addEventListener("click", loadProducts);
    
async function initializeAdminPanel() {
  try {
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      window.location.replace("./signin.html");
      return;
    }

    const user = sessionData.session.user;

    const { data: adminRecord, error: adminError } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (adminError) throw adminError;

    if (!adminRecord) {
      statusMessage.textContent =
        "Access denied. This account is not an administrator.";
      await supabaseClient.auth.signOut();
      window.location.replace("./signin.html");
      return;
    }

    statusMessage.textContent =
      "Admin access verified. Supabase connected.";
document.getElementById("admin-content").hidden = false;
    await loadProducts();
  } catch (error) {
    statusMessage.textContent =
      "Connection error: " + error.message;
  }
}

    initializeAdminPanel();
  </script>
  <script>
  const signOutButton = document.getElementById("sign-out-button");
  signOutButton.addEventListener("click", async () => {
    const { error } = await supabaseClient.auth.signOut();
    if (error) {
      alert("Sign out failed: " + error.message);
      return;
    }
    window.location.href = "./signin.html";
  });
</script>
</body>
</html>

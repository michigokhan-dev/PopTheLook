<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e7">
  <meta name="description" content="Discover timeless women's fashion at POP THE LOOK.">
  <title>POP THE LOOK | Women's Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/styles/style.css">
  <style>
    /* Make homepage product cards wider, in a clean two-column layout. */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 30px 20px;
      width: 100%;
    }
    .product-card {
      min-width: 0;
      width: 100%;
    }
    
.product-card img {
  display: block;
  width: 100%;
  height: 300px;
  aspect-ratio: auto;
  object-fit: contain;
  object-position: center;
  background-color: #f5f0e7;
}

    @media (min-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 36px 24px;
      }
    }
    .product-prices {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
    }
    .product-price-old {
      color: #c62828;
      text-decoration: line-through;
      opacity: 1;
    }
    .product-card h3 {
      text-align: center;
      width: 100%;
    }
    .product-price-current {
      color: #211e19;
      font-weight: 600;
    }
    
/* Responsive product grid */
#products-grid.products-grid {
  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  gap: 12px !important;
  width: 100% !important;
}

@media screen and (orientation: landscape) and (max-width: 899px) {
  #products-grid.products-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  }
}

@media screen and (orientation: portrait) and (max-width: 700px) {
  #products-grid.products-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }
}

@media screen and (min-width: 900px) {
  #products-grid.products-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  }
}
.shop-category-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 20px 0;
}

.shop-category-button {
  padding: 9px 16px;
  border: 1px solid #ded5c7;
  background: transparent;
  color: #211e19;
  cursor: pointer;
  font-size: 13px;
}

.shop-category-button.active {
  background: #211e19;
  color: #fff;
  border-color: #211e19;
}

.shop-empty-message {
  padding: 24px 0;
  color: #796b58;
  text-align: center;
}
    .shop-menu {
  position: relative;
  margin: 20px 0;
}

.shop-menu-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  background: #211e19;
  color: #fff;
  border: 1px solid #211e19;
  cursor: pointer;
  font-size: 14px;
}

.shop-menu-panel {
  margin-top: 10px;
  padding: 16px;
  border: 1px solid #ded5c7;
  background: #f5f0e7;
}

.shop-department-button {
  display: block;
  width: 100%;
  padding: 13px 8px;
  border: 0;
  border-bottom: 1px solid #ded5c7;
  background: transparent;
  color: #211e19;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
}

.shop-department-button:hover {
  background: #ebe3d7;
}

.shop-category-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.shop-category-button {
  padding: 9px 12px;
  border: 1px solid #ded5c7;
  background: transparent;
  color: #211e19;
  cursor: pointer;
  font-size: 13px;
}

.shop-category-button.active {
  background: #211e19;
  color: #fff;
  border-color: #211e19;
}
  </style>
</head>
<body>
  <header class="header">
    <a class="logo" href="#home">POP THE LOOK</a>
    <nav class="navigation" aria-label="Main navigation">
      <a class="active" href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
    </nav>
    <div class="header-actions">
      <a class="icon-button" href="#shop" aria-label="Search products">
        <svg viewBox="0 0 24 24">
          <circle cx="10.8" cy="10.8" r="7.2"/>
          <path d="m16 16 5 5"/>
        </svg>
      </a>
      <a class="icon-button" id="account-icon" href="frontend/pages/signin.html" aria-label="Sign in or create an account">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="7.5" r="3.5"/>
          <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
        </svg>
      </a>
      <a class="icon-button" href="#cart" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24">
          <path d="M4 8h16l-1 13H5L4 8Z"/>
          <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
        </svg>
        <span class="cart-count">0</span>
      </a>
    </div>
  </header>
  <main>
    <section class="hero" id="home">
      <div class="hero-content">
        <div class="eyebrow">THE NEW COLLECTION</div>
        <h1>Style that<br>speaks softly.</h1>
        <p class="hero-description">
          Timeless pieces. Effortless elegance.<br>
          Discover your next favourite look.
        </p>
        <a class="hero-cta" href="#shop">
          EXPLORE THE COLLECTION
          <svg viewBox="0 0 24 24">
            <path d="M4 12h15M13 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </section>
    <section class="intro" id="shop">
      <p class="intro-label">POP THE LOOK</p>
      <h2>Your wardrobe, reimagined.</h2>
      <div class="shop-menu">
  <button id="shop-menu-toggle" class="shop-menu-toggle" type="button" aria-expanded="false">
    ☰ <span>All</span>
  </button>

  <div id="shop-menu-panel" class="shop-menu-panel" hidden>
    <button type="button" class="shop-department-button" data-department="women">Women</button>
    <button type="button" class="shop-department-button" data-department="men">Men — Coming Soon</button>
    <button type="button" class="shop-department-button" data-department="kids">Kids — Coming Soon</button>
    <div id="shop-category-filters" class="shop-category-filters" hidden></div>
  </div>
</div>
      <div id="products-grid" class="products-grid"></div>
    </section>
    <footer id="about">
      © 2026 POP THE LOOK. All rights reserved.
    </footer>
  </main>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const supabase = createClient(
    "https://imkkafqtlvuzloalcfvk.supabase.co",
    "sb_publishable_aetzVolyZMx-vTdoaZ9zXw_OtEefK-N"
  );

  
const productsGrid = document.getElementById("products-grid");
const categoryFilters = document.getElementById("shop-category-filters");
const menuToggle = document.getElementById("shop-menu-toggle");
const menuPanel = document.getElementById("shop-menu-panel");

let allProducts = [];
let activeCategory = "all";
let activeDepartment = "women";

const categoryGroups = {
  "New In": ["New In"],
  "Dresses": [
    "All Dresses", "Midi", "Maxi", "Mini", "Wedding Guest Dresses",
    "Party Dresses", "Short Sleeve", "Long Sleeve", "Linen Dresses"
  ],
  "Tops & T-Shirts": [
    "All Tops & T-Shirts", "New In Tops & T-Shirts", "Blouses",
    "Body suit", "Cardigan", "Jumper", "Shirts", "Tops", "T-Shirts",
    "Vest Tops", "Short Sleeve", "Long Sleeve", "Sleeveless"
  ],
  "Jackets & Coats": [
    "Biker & racer jackets", "Bomber jackets", "Denim jackets",
    "Fleece jackets", "Puffer jackets", "Faux fur coats", "Long coats",
    "Parkas", "Capes & ponchos", "Blazers"
  ],
  "Other Clothing": [
    "Knitwears", "Leggings", "Shorts", "Skirts", "Trousers"
  ],
  "Jeans": [
    "Boyfriend jeans", "Cropped jeans", "Flared jeans",
    "High waisted jeans", "Ripped jeans", "Skinny jeans", "Straight jeans"
  ],
  "More": [
    "Nightwears", "Jumpsuits", "Playsuits", "Tracksuits", "Underwears",
    "Bags", "Accessories & Jewellery", "Sportswear", "Beauty", "Fragrance"
  ]
};

const formatPrice = value => new Intl.NumberFormat("en-GB", {
  style: "currency",
  currency: "GBP"
}).format(Number(value) || 0);

if (menuToggle && menuPanel) {
  menuToggle.addEventListener("click", () => {
    const isOpening = menuPanel.hidden;
    menuPanel.hidden = !isOpening;
    menuToggle.setAttribute("aria-expanded", String(isOpening));
  });
}

function renderCategoryFilters() {
  if (!categoryFilters) return;

  categoryFilters.replaceChildren();
  categoryFilters.hidden = activeDepartment !== "women";

  Object.entries(categoryGroups).forEach(([groupName, categories]) => {
    const group = document.createElement("details");
    group.className = "shop-category-group";

    const heading = document.createElement("summary");
    heading.textContent = groupName;
    group.appendChild(heading);

    categories.forEach(category => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "shop-category-button";
      button.textContent = category;

      if (activeCategory === category) {
        button.classList.add("active");
      }

      button.addEventListener("click", () => {
        activeCategory = category;
        renderCategoryFilters();
        renderProducts();
      });

      group.appendChild(button);
    });

    categoryFilters.appendChild(group);
  });

  const allButton = document.createElement("button");
  allButton.type = "button";
  allButton.className = "shop-category-button";
  allButton.textContent = "All Products";

  if (activeCategory === "all") {
    allButton.classList.add("active");
  }

  allButton.addEventListener("click", () => {
    activeCategory = "all";
    renderCategoryFilters();
    renderProducts();
  });

  categoryFilters.prepend(allButton);
}

document.querySelectorAll(".shop-department-button").forEach(button => {
  button.addEventListener("click", () => {
    const department = button.dataset.department;

    if (department !== "women") {
      alert(
        department === "men"
          ? "Men — Coming Soon"
          : "Kids — Coming Soon"
      );
      return;
    }

    activeDepartment = "women";
    activeCategory = "all";
    renderCategoryFilters();
  });
});

function renderProducts() {
  if (!productsGrid) return;

  productsGrid.replaceChildren();

  const filteredProducts = activeCategory === "all"
    ? allProducts
    : allProducts.filter(product => {
        const category = (product.category || "").trim().toLowerCase();
        const selected = activeCategory.toLowerCase();

        return category === selected ||
          (selected === "all dresses" && category === "dresses") ||
          (selected === "all tops & t-shirts" &&
            ["tops", "t-shirts", "tops & t-shirts"].includes(category));
      });

  if (filteredProducts.length === 0) {
    const message = document.createElement("p");
    message.className = "shop-empty-message";
    message.textContent = "No products in this category yet.";
    productsGrid.appendChild(message);
    return;
  }

  filteredProducts.forEach(product => {
    const card = document.createElement("article");
    card.className = "product-card";
    card.style.cursor = "pointer";

    if (product.image_url) {
      const image = document.createElement("img");
      image.alt = product.name || "Fashion product";
      image.loading = "lazy";
      image.src = product.image_url;
      card.appendChild(image);
    }

    const name = document.createElement("h3");
    name.textContent = product.name || "Untitled product";
    card.appendChild(name);

    const prices = document.createElement("div");
    prices.className = "product-prices";

    const currentPrice = Number(product.price) || 0;
    const compareAtPrice = Number(product.compare_at_price);

    if (
      product.compare_at_price !== null &&
      product.compare_at_price !== "" &&
      Number.isFinite(compareAtPrice) &&
      compareAtPrice > currentPrice
    ) {
      const oldPrice = document.createElement("span");
      oldPrice.className = "product-price-old";
      oldPrice.textContent = formatPrice(compareAtPrice);
      oldPrice.setAttribute("aria-label", "Old price");
      prices.appendChild(oldPrice);
    }

    const currentPriceElement = document.createElement("span");
    currentPriceElement.className = "product-price-current";
    currentPriceElement.textContent = formatPrice(currentPrice);
    currentPriceElement.setAttribute("aria-label", "Now price");
    prices.appendChild(currentPriceElement);

    card.appendChild(prices);

    card.addEventListener("click", event => {
      if (event.target.closest("select, label, button, summary")) return;
      window.location.href =
        `frontend/pages/product.html?id=${encodeURIComponent(product.id)}`;
    });

    productsGrid.appendChild(card);
  });
}

async function loadStoreProducts() {
  if (!productsGrid) return;

  const { data: products, error } = await supabase
    .from("products")
    .select("id, name, price, compare_at_price, category, image_url, is_active")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Products error:", error);
    productsGrid.textContent = "Products could not be loaded.";
    return;
  }

  allProducts = products || [];
  renderCategoryFilters();
  renderProducts();
}

loadStoreProducts();


  const accountIcon = document.getElementById("account-icon");
  let dropdown = document.getElementById("account-dropdown");

  if (!dropdown && accountIcon?.parentElement) {
    dropdown = document.createElement("div");
    dropdown.id = "account-dropdown";
    dropdown.textContent = "Sign Out";
    Object.assign(dropdown.style, {
      display: "none",
      position: "absolute",
      right: "0",
      top: "100%",
      padding: "12px 18px",
      background: "#fff",
      color: "#222",
      cursor: "pointer",
      zIndex: "1000",
      boxShadow: "0 4px 12px #0002"
    });
    accountIcon.parentElement.style.position = "relative";
    accountIcon.parentElement.appendChild(dropdown);
  }

  const { data: { session } } = await supabase.auth.getSession();

  if (session && accountIcon) {
    accountIcon.href = "#";
    accountIcon.setAttribute("aria-label", "Account menu");
  }

  accountIcon?.addEventListener("click", async event => {
    const { data: { session: currentSession } } = await supabase.auth.getSession();
    if (!currentSession) return;

    event.preventDefault();
    if (dropdown) {
      dropdown.style.display =
        dropdown.style.display === "none" ? "block" : "none";
    }
  });

  dropdown?.addEventListener("click", async () => {
    const { error } = await supabase.auth.signOut();

    if (error) {
      alert(error.message);
      return;
    }

    window.location.href = "frontend/pages/signin.html";
  });

  supabase.auth.onAuthStateChange((_event, session) => {
    if (!accountIcon) return;
    if (!session) {
      accountIcon.href = "frontend/pages/signin.html";
      if (dropdown) dropdown.style.display = "none";
    } else {
      accountIcon.href = "#";
    }
  });
</script>
</body>
</html>
